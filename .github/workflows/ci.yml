name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test ./...
      - run: CGO_ENABLED=0 go build -trimpath -o filenav . && ./filenav version
      - name: Cross-compile all release targets
        run: |
          for t in amd64 arm64 386 arm; do CGO_ENABLED=0 GOOS=linux GOARCH=$t GOARM=7 go build -o /dev/null . || exit 1; done
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: for f in web/*.js; do node --check "$f"; done
