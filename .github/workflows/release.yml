name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Vet and test
        run: go vet ./... && go test ./...
      - name: Build binaries
        run: |
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 linux/arm/7 linux/386; do
            IFS=/ read -r os arch arm <<< "$target"
            name="filenav-${os}-${arch}${arm:+v$arm}"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch GOARM=$arm \
              go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o "dist/${name}" .
          done
          cd dist && sha256sum filenav-* > SHA256SUMS && ls -la
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## \\[?"v {f=1; next} /^## /{f=0} f' CHANGELOG.md)
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            && gh release upload "$GITHUB_REF_NAME" dist/* --clobber \
            || gh release create "$GITHUB_REF_NAME" dist/* --title "filenav $GITHUB_REF_NAME" --notes "${notes:-Release $GITHUB_REF_NAME}"
